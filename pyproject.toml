[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-teknofest-projects"
version = "0.3.0"
description = "AI-powered agricultural monitoring systems for TEKNOFEST"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Qurbanəli Feyzullayev", email = "qurbanelifeyzullayev@gmail.com"},
]
keywords = ["ai", "agriculture", "detection", "teknofest", "yolo", "ndvi", "crop-health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
    "pdfminer.six>=20240706",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "scipy>=1.11.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "pre-commit>=3.5.0",
    "types-PyYAML",
    "httpx>=0.25.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.17",
    "mkdocstrings[python]>=0.24.0",
    "pillow>=10.2.0",
]
demo = [
    "streamlit>=1.29.0",
    "gradio>=4.12.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]
all = [
    "my-teknofest-projects[dev,docs,demo,api]",
]

[project.scripts]
sonic-detect = "sonic.src.cli:main"
extract-text = "tools.text_extractor:main"
agroscan = "agroscan.src.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["sonic*", "agroscan*", "tools*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--verbose --cov=sonic --cov=tools"
